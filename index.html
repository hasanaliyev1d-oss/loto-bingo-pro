<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun və Balans Sistemi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .balance-box { font-size: 20px; margin-bottom: 15px; background: #334155; padding: 10px; border-radius: 8px; }
        button { background: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; width: 100%; }
        button:hover { background: #16a34a; }
        input { width: calc(100% - 20px); padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        .hidden { display: none; }
        .history-list { text-align: left; max-height: 150px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" id="login-screen">
    <h2>Oyuna Giriş</h2>
    <input type="text" id="username" placeholder="Adınızı daxil edin...">
    <input type="text" id="room-code" placeholder="Kodu daxil edin (məs: 123)">
    <button onclick="joinGame()">Daxil ol və Başla</button>
</div>

<div class="container hidden" id="game-screen">
    <div class="balance-box">Balans: <span id="balance">0.00</span> AZN</div>
    
    <button onclick="openDeposit()">Depozit Et (Balans Artır)</button>
    <button onclick="openWithdraw()">Çıxarış Et</button>
    <button onclick="buyCard()">Kart Al (0.50 AZN)</button>

    <div id="host-controls" class="hidden">
        <h3>Host Panel</h3>
        <button onclick="startGame()">Oyunu Başlat</button>
    </div>

    <div id="game-area">
        <h3 id="status-text">Oyunçular gözlənilir...</h3>
    </div>

    <h4>Tarixçə</h4>
    <div class="history-list" id="history"></div>
</div>

<!-- Depozit Modalı -->
<div class="container hidden" id="deposit-modal">
    <h3>Depozit</h3>
    <p>Kart: <b>5411249813079287</b></p>
    <input type="text" id="check-number" placeholder="Çəkin üzərindəki rəqəmi daxil edin">
    <button onclick="confirmDeposit()">Təsdiq Et</button>
    <button style="background:#ef4444;" onclick="closeModals()">Geri</button>
</div>

<!-- Çıxarış Modalı -->
<div class="container hidden" id="withdraw-modal">
    <h3>Çıxarış</h3>
    <input type="number" id="withdraw-amount" placeholder="Məbləği qeyd edin (AZN)">
    <button onclick="confirmWithdraw()">Teleqrama Göndər</button>
    <button style="background:#ef4444;" onclick="closeModals()">Geri</button>
</div>

<script>
    const socket = io();
    let balance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
    let historyData = JSON.parse(localStorage.getItem('user_history')) || [];
    let isHost = false;

    updateUI();

    function joinGame() {
        const username = document.getElementById('username').value;
        const code = document.getElementById('room-code').value;
        if(!username || !code) return alert("Məlumatları doldurun!");

        socket.emit('join-game', username);
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
    }

    socket.on('set-host', (status) => {
        isHost = status;
        if(isHost) {
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('status-text').innerText = "Oyunu başlada bilərsiniz.";
        } else {
            document.getElementById('status-text').innerText = "Hostun oyunu başlatması gözlənilir...";
        }
    });

    socket.on('ready-to-start', (players) => {
        if(!isHost) {
            document.getElementById('status-text').innerText = "Oyunçular qoşuldu. Başlamaq üçün gözləyin.";
        }
    });

    function startGame() {
        socket.emit('start-game-signal');
    }

    socket.on('game-started', () => {
        document.getElementById('status-text').innerText = "Oyun başladı! Uğurlar!";
    });

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
        localStorage.setItem('user_balance', balance);
        
        const historyEl = document.getElementById('history');
        historyEl.innerHTML = historyData.map(h => `<div>• ${h}</div>`).join('');
        localStorage.setItem('user_history', JSON.stringify(historyData));
    }

    function openDeposit() { document.getElementById('deposit-modal').classList.remove('hidden'); }
    function openWithdraw() { document.getElementById('withdraw-modal').classList.remove('hidden'); }
    function closeModals() { 
        document.getElementById('deposit-modal').classList.add('hidden');
        document.getElementById('withdraw-modal').classList.add('hidden');
    }

    function confirmDeposit() {
        const checkVal = document.getElementById('check-number').value;
        if(checkVal === "5411249813079287" || checkVal.length >= 6) {
            balance += 10;
            historyData.unshift(`Depozit təsdiqləndi: +10 AZN`);
            updateUI();
            closeModals();
            alert("Məbləğ balansa əlavə olundu!");
        } else {
            alert("Çəkin üzərindəki rəqəm uyğun gəlmədi!");
        }
    }

    function buyCard() {
        if(balance >= 0.50) {
            balance -= 0.50;
            historyData.unshift(`Kart alındı: -0.50 AZN`);
            updateUI();
            alert("Kart uğurla alındı!");
        } else {
            alert("Balansda kifayət qədər vəsait yoxdur!");
        }
    }

    function confirmWithdraw() {
        const amount = document.getElementById('withdraw-amount').value;
        if(!amount || amount <= 0) return alert("Düzgün məbləğ daxil edin!");
        if(amount > balance) return alert("Balansda kifayət qədər pul yoxdur!");

        balance -= parseFloat(amount);
        historyData.unshift(`Çıxarış tələbi: -${amount} AZN`);
        updateUI();
        
        const telegramUser = "SENIN_TELEGRAM_USERNAME"; 
        const message = encodeURIComponent(`Salam, çıxarış etmək istəyirəm. Məbləğ: ${amount} AZN`);
        window.open(`https://t.me/${telegramUser}?text=${message}`, '_blank');
        
        closeModals();
    }
</script>

</body>
</html>
